<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Формула Побега / Қашу Формуласы — Нулевой Блок</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="bg-canvas"></canvas>

<!-- ================= ГЛАВНОЕ МЕНЮ ================= -->
<div class="screen active" id="screen-menu">
  <!-- Неоновые уголки интерфейса -->
  <div class="hud-corner top-left"></div>
  <div class="hud-corner top-right"></div>
  <div class="hud-corner bottom-left"></div>
  <div class="hud-corner bottom-right"></div>

  <div class="topbar">
    <div class="brand"><b data-i18n="brand.game"></b> · <span data-i18n="brand.block"></span></div>
    <div class="topbar-actions">
      <button class="icon-btn" data-nav="teacher" data-i18n="brand.teacherLink"></button>
      <div class="lang-switch" role="group" aria-label="RU / QAZ">
        <button class="lang-btn" data-lang="ru">RU</button>
        <button class="lang-btn" data-lang="kk">ҚАЗ</button>
      </div>
    </div>
  </div>

  <div class="hero-container">
    <!-- Анимированное голографическое кольцо высшей математики -->
    <div class="holo-ring-wrap">
      <div class="holo-ring ring-outer"></div>
      <div class="holo-ring ring-inner"></div>
      <div class="holo-core">π</div>
    </div>

    <main class="center-col hero-content">
      <div class="kicker-badge">
        <span class="pulse-dot"></span>
        <span data-i18n="menu.kicker"></span>
      </div>
      
      <h1 class="glitch-title" data-i18n="menu.title"></h1>
      <p class="lead" data-i18n="menu.lead"></p>

      <div class="cta-group">
        <button class="btn btn-cyber-primary btn-xl" id="btn-new-game">
          <span class="btn-icon">▶</span>
          <span data-i18n="menu.newGame"></span>
        </button>
        <button class="btn btn-cyber-secondary btn-xl" id="btn-continue" disabled>
          <span class="btn-icon">⚡</span>
          <span data-i18n="menu.continueGame"></span>
        </button>
      </div>

      <!-- Быстрая статистика/статус внизу в виде компактных неоновых плашек -->
      <div class="hero-stats-row">
        <div class="stat-pill">
          <span class="stat-lbl" data-i18n="hud.sector">Сектор:</span>
          <span class="stat-val">Нулевой Блок</span>
        </div>
        <div class="stat-pill">
          <span class="stat-lbl" data-i18n="hud.locksSolved">Замков:</span>
          <span class="stat-val neon-green" id="menu-locks-count">0 / 12</span>
        </div>
        <div class="stat-pill">
          <span class="stat-lbl">Статус:</span>
          <span class="stat-val neon-cyan">ONLINE</span>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- ================= ВЫБОР РЕЖИМА ================= -->
<div class="screen" id="screen-mode">
  <div class="topbar">
    <div class="brand"><b data-i18n="brand.game"></b> · <span data-i18n="mode.brandSuffix"></span></div>
    <div class="topbar-actions">
      <button class="icon-btn" data-nav="menu" data-i18n="nav.toMenu"></button>
      <div class="lang-switch" role="group" aria-label="RU / QAZ">
        <button class="lang-btn" data-lang="ru">RU</button>
        <button class="lang-btn" data-lang="kk">ҚАЗ</button>
      </div>
    </div>
  </div>
  <div class="center-col">
    <div class="kicker" data-i18n="mode.kicker"></div>
    <h1 style="font-size:26px;" data-i18n="mode.title"></h1>
    <p class="lead" data-i18n="mode.lead"></p>
    <div class="card-row">
      <div class="mode-card">
        <span class="tag" data-i18n="mode.storyTag"></span>
        <h3 data-i18n="mode.storyTitle"></h3>
        <p data-i18n="mode.storyDesc"></p>
        <button class="btn btn-primary" data-mode="story" style="width:100%;" data-i18n="mode.storyBtn"></button>
      </div>
      <div class="mode-card">
        <span class="tag" data-i18n="mode.gaussTag"></span>
        <h3 data-i18n="mode.gaussTitle"></h3>
        <p data-i18n="mode.gaussDesc"></p>
        <button class="btn btn-primary" data-mode="gauss" style="width:100%;" data-i18n="mode.gaussBtn"></button>
      </div>
    </div>
  </div>
</div>

<!-- ================= КАРТА ГЛАВ ================= -->
<div class="screen" id="screen-map">
  <div class="topbar">
    <div class="brand"><b data-i18n="map.brandPrefix"></b> · <span id="map-mode-label"></span></div>
    <div class="topbar-actions">
      <button class="icon-btn" data-nav="menu" data-i18n="nav.toMenu"></button>
      <div class="lang-switch" role="group" aria-label="RU / QAZ">
        <button class="lang-btn" data-lang="ru">RU</button>
        <button class="lang-btn" data-lang="kk">ҚАЗ</button>
      </div>
    </div>
  </div>
  <div class="center-col">
    <div class="kicker" data-i18n="map.kicker"></div>
    <h1 style="font-size:26px;" data-i18n="map.title"></h1>
    <div class="chapter-list">
      <button class="chapter-item" id="chapter-1-card">
        <div style="display:flex;align-items:center;">
          <span class="num">01</span>
          <div class="info">
            <h4 data-i18n="map.ch1title"></h4>
            <span data-i18n="map.ch1desc"></span>
          </div>
        </div>
        <span class="icon-btn" style="pointer-events:none;" data-i18n="map.enter"></span>
      </button>
      <div class="chapter-item locked">
        <div style="display:flex;align-items:center;">
          <span class="num">02</span>
          <div class="info">
            <h4 data-i18n="map.ch2title"></h4>
            <span data-i18n="map.ch2desc"></span>
          </div>
        </div>
      </div>
      <div class="chapter-item locked">
        <div style="display:flex;align-items:center;">
          <span class="num">03</span>
          <div class="info">
            <h4 data-i18n="map.ch3title"></h4>
            <span data-i18n="map.ch3desc"></span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ================= КОМНАТА (ГЛАВА 1) ================= -->
<div class="screen" id="screen-room">
  <div class="topbar">
    <div class="brand"><b data-i18n="room.chapterLabel"></b> · <span data-i18n="map.ch1title"></span> · <span id="room-mode-label"></span></div>
    <div class="topbar-actions">
      <button class="icon-btn" id="btn-pause" data-i18n="room.pause"></button>
      <div class="lang-switch" role="group" aria-label="RU / QAZ">
        <button class="lang-btn" data-lang="ru">RU</button>
        <button class="lang-btn" data-lang="kk">ҚАЗ</button>
      </div>
    </div>
  </div>
  <div class="room-wrap">
    <div class="room-body">
      <div class="room-stage">
        <div class="room-caption" data-i18n="room.caption"></div>
        <p class="room-desc" data-i18n="room.desc"></p>
        <div class="object-grid" id="object-grid"></div>
      </div>
      <div class="side-panel">
        <div class="side-block">
          <h5 data-i18n="room.alarmHeader"></h5>
          <div class="alarm-track"><div class="alarm-fill" id="alarm-fill" style="width:0%;"></div></div>
          <div class="alarm-label"><span id="alarm-num">0 / 100</span><span id="alarm-state"></span></div>
        </div>
        <div class="side-block">
          <h5 data-i18n="room.progressHeader"></h5>
          <div class="stat-line"><span data-i18n="room.solved"></span><b id="stat-solved">0 / 4</b></div>
          <div class="stat-line"><span data-i18n="room.score"></span><b id="stat-score">0</b></div>
          <div class="stat-line"><span data-i18n="room.loreFound"></span><b id="stat-lore">0 / 2</b></div>
        </div>
        <div class="side-block" style="flex:1;min-height:0;display:flex;flex-direction:column;">
          <h5 data-i18n="room.logHeader"></h5>
          <div class="log-list" id="log-list"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ================= РЕЖИМ ПРЕПОДАВАТЕЛЯ ================= -->
<div class="screen" id="screen-teacher">
  <div class="topbar">
    <div class="brand"><b data-i18n="teacher.brand"></b> · <span data-i18n="teacher.brandSuffix"></span></div>
    <div class="topbar-actions">
      <button class="icon-btn" data-nav="menu" data-i18n="nav.toMenu"></button>
      <div class="lang-switch" role="group" aria-label="RU / QAZ">
        <button class="lang-btn" data-lang="ru">RU</button>
        <button class="lang-btn" data-lang="kk">ҚАЗ</button>
      </div>
    </div>
  </div>
  <div class="teacher-wrap">
    <p class="lead" style="margin:0 0 18px;text-align:left;max-width:640px;" data-i18n="teacher.lead"></p>
    <div class="teacher-toolbar">
      <button class="btn btn-primary" id="btn-new-task" data-i18n="teacher.newTask"></button>
      <button class="btn" id="btn-export-json" data-i18n="teacher.exportJson"></button>
      <button class="btn" id="btn-import-json" data-i18n="teacher.importJson"></button>
      <input type="file" id="import-file-input" accept="application/json" style="display:none;">
    </div>
    <table class="task-table">
      <thead><tr>
        <th data-i18n="teacher.colName"></th>
        <th data-i18n="teacher.colTopic"></th>
        <th data-i18n="teacher.colMode"></th>
        <th data-i18n="teacher.colDifficulty"></th>
        <th data-i18n="teacher.colAnswer"></th>
        <th></th>
      </tr></thead>
      <tbody id="teacher-built-in-rows"></tbody>
      <tbody id="teacher-custom-rows"></tbody>
    </table>
    <div class="empty-note" id="teacher-empty-note" style="display:none;" data-i18n="teacher.emptyNote"></div>
    <p class="helper-text" data-i18n="teacher.helperText"></p>
  </div>
</div>

<!-- ================= МОДАЛЬ ЗАДАЧИ ================= -->
<div class="modal-overlay" id="modal-task">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-topic" id="task-topic-label">ТЕМА</div>
      <button class="modal-close" id="task-close">×</button>
    </div>
    <h3 id="task-title"></h3>
    <div class="narrative" id="task-narrative"></div>
    <div class="prompt-text" id="task-prompt"></div>
    <div class="feedback" id="task-feedback"></div>
    <div class="answer-row">
      <input type="text" id="task-answer" inputmode="decimal">
      <button class="btn btn-primary" id="task-submit" data-i18n="task.submit"></button>
    </div>
    <div class="answer-hint-note" id="task-format-note"></div>
    <div class="modal-actions">
      <button class="icon-btn" id="task-hint-btn"></button>
      <button class="icon-btn" id="task-ref-btn" style="display:none;" data-i18n="task.refBtn"></button>
    </div>
    <div class="ref-sheet" id="task-ref-sheet"></div>
    <div class="hint-zone" id="task-hint-zone" style="display:none;"></div>
  </div>
</div>

<!-- ================= МОДАЛЬ НАХОДКИ (LORE) ================= -->
<div class="modal-overlay" id="modal-lore">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-topic" data-i18n="lore.badge"></div>
      <button class="modal-close" id="lore-close">×</button>
    </div>
    <h3 id="lore-title"></h3>
    <div class="prompt-text" id="lore-text"></div>
    <div class="modal-actions"><button class="btn btn-primary" id="lore-ok" data-i18n="lore.ok"></button></div>
  </div>
</div>

<!-- ================= ПАУЗА ================= -->
<div class="modal-overlay" id="modal-pause">
  <div class="modal overlay-card">
    <h3 data-i18n="pause.title"></h3>
    <p class="lead" style="margin-bottom:22px;" data-i18n="pause.lead"></p>
    <div style="display:flex;flex-direction:column;gap:10px;">
      <button class="btn btn-primary" id="pause-resume" data-i18n="pause.resume"></button>
      <button class="btn" id="pause-restart" data-i18n="pause.restart"></button>
      <button class="btn btn-danger" id="pause-menu" data-i18n="pause.toMenu"></button>
    </div>
  </div>
</div>

<!-- ================= ПОБЕДА ================= -->
<div class="modal-overlay" id="modal-win">
  <div class="modal overlay-card">
    <div class="kicker" data-i18n="win.kicker"></div>
    <h3 data-i18n="win.title"></h3>
    <p class="lead" data-i18n="win.lead"></p>
    <div class="stat-grid">
      <div class="stat-box"><div class="n" id="win-score">0</div><div class="l" data-i18n="win.statScore"></div></div>
      <div class="stat-box"><div class="n" id="win-alarm">0</div><div class="l" data-i18n="win.statAlarm"></div></div>
      <div class="stat-box"><div class="n" id="win-hints">0</div><div class="l" data-i18n="win.statHints"></div></div>
      <div class="stat-box"><div class="n" id="win-lore">0/2</div><div class="l" data-i18n="win.statLore"></div></div>
    </div>
    <button class="btn btn-primary" id="win-menu-btn" style="width:100%;" data-i18n="win.toMenu"></button>
  </div>
</div>

<!-- ================= ПОРАЖЕНИЕ ================= -->
<div class="modal-overlay" id="modal-lose">
  <div class="modal overlay-card">
    <div class="kicker" style="color:var(--amber-bright);" data-i18n="lose.kicker"></div>
    <h3 data-i18n="lose.title"></h3>
    <p class="lead" data-i18n="lose.lead"></p>
    <div style="display:flex;flex-direction:column;gap:10px;">
      <button class="btn btn-primary" id="lose-retry" data-i18n="pause.restart"></button>
      <button class="btn" id="lose-menu" data-i18n="win.toMenu"></button>
    </div>
  </div>
</div>

<!-- ================= РЕДАКТОР ЗАДАЧИ (УЧИТЕЛЬ) ================= -->
<div class="modal-overlay" id="modal-editor">
  <div class="modal wide">
    <div class="modal-head">
      <div class="modal-topic" data-i18n="editor.badge"></div>
      <button class="modal-close" id="editor-close">×</button>
    </div>
    <h3 id="editor-title"></h3>
    <div class="form-grid">
      <div class="field"><label data-i18n="editor.lblTitle"></label><input id="ed-title"></div>
      <div class="field"><label data-i18n="editor.lblTopic"></label><input id="ed-topic"></div>
      <div class="field"><label data-i18n="editor.lblMode"></label>
        <select id="ed-mode"><option value="story" data-i18n="mode.storyTitle"></option><option value="gauss" data-i18n="mode.gaussTitle"></option></select>
      </div>
      <div class="field"><label data-i18n="editor.lblDifficulty"></label>
        <select id="ed-difficulty"><option value="basic" data-i18n="diff.basic"></option><option value="strong" data-i18n="diff.strong"></option><option value="olympiad" data-i18n="diff.olympiad"></option></select>
      </div>
    </div>
    <div class="form-grid full">
      <div class="field"><label data-i18n="editor.lblNarrative"></label><textarea id="ed-narrative"></textarea></div>
      <div class="field"><label data-i18n="editor.lblPrompt"></label><textarea id="ed-prompt"></textarea></div>
    </div>
    <div class="form-grid">
      <div class="field"><label data-i18n="editor.lblAnswer"></label><input id="ed-answer" type="text" inputmode="decimal"></div>
      <div class="field"><label data-i18n="editor.lblTolerance"></label><input id="ed-tolerance" type="text" value="0.01"></div>
    </div>
    <div class="form-grid full">
      <div class="field"><label data-i18n="editor.lblHint1"></label><input id="ed-hint1"></div>
      <div class="field"><label data-i18n="editor.lblHint2"></label><input id="ed-hint2"></div>
      <div class="field"><label data-i18n="editor.lblSolution"></label><textarea id="ed-solution"></textarea></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-danger" id="editor-delete" style="display:none;" data-i18n="editor.delete"></button>
      <button class="btn btn-primary" id="editor-save" data-i18n="editor.save"></button>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
